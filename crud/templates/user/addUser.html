{% extends "layout/base.html" %}

{% block 'title' %} Add User {% endblock 'title' %}

{% block 'content' %}

{% include "includes/sidebar.html" %}
{% include "includes/ToastMessage.html" %}

<div class="p-2 sm:ml-64 mt-16 md:mt-14">
  <div class="mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-1 gap-4">
      <form method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded shadow-md">
        {% csrf_token %}
        <div class="mb-5">
          <label class="block mb-2 text-sm font-medium text-gray-900">Profile Image</label>
          <input type="file" name="profile" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50">
        </div>

        <div class="mb-4">
          <label for="full_name" class="block text-sm font-medium mb-2">Full Name</label>
          <input type="text" name="full_name" id="full_name" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="gender" class="block text-sm font-medium mb-2">Gender</label>
          <select name="gender" id="gender" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
            <option value="">Select Gender</option>
            {% for gender in genders %}
              <option value="{{ gender.gender_id }}">{{ gender.gender }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label for="birth_date" class="block text-sm font-medium mb-2">Birth Date</label>
          <input type="date" name="birth_date" id="birth_date" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="address" class="block text-sm font-medium mb-2">Address</label>
          <input type="text" name="address" id="address" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="contact_number" class="block text-sm font-medium mb-2">Contact Number</label>
          <input type="text" name="contact_number" id="contact_number" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="email" class="block text-sm font-medium mb-2">Email</label>
          <input type="email" name="email" id="email" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="username" class="block text-sm font-medium mb-2">Username</label>
          <input type="text" name="username" id="username" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="password" class="block text-sm font-medium mb-2">Password</label>
          <input type="password" name="password" id="password" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <div class="mb-4">
          <label for="confirm_password" class="block text-sm font-medium mb-2">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" class="bg-white px-3 py-2.5 border border-gray-300 text-black block text-sm rounded-sm w-full focus:outline-none focus:ring-blue-600 focus:border-blue-600">
        </div>

        <button type="submit" class="bg-green-600 text-sm font-medium text-white px-3 py-2.5 rounded-sm shadow-sm cursor-pointer hover:bg-green-700 focus:outline-none">
          Add User
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock 'content' %}
